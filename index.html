<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f5f0"><meta name="description" content="夜四技投資學期中考題庫，41 題是非與 7 題計算申論。支援隨機抽題、錯題複習、搜尋、公式速查與本機學習紀錄。"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="投資學刷題"><title>投資學刷題｜期中考複習</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E"><style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Helvetica Neue", sans-serif;
    background: #f5f5f0;
    color: #1f1f1d;
    line-height: 1.6;
    font-size: 15px;
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 8px 0 16px; }
  h2 { font-size: 17px; font-weight: 600; margin: 20px 0 10px; color: #555; }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-card {
    background: #ffffff;
    border-radius: 12px;
    padding: 14px;
    border: 1px solid #e8e6df;
  }
  .stat-label {
    font-size: 12px;
    color: #888;
    margin-bottom: 4px;
  }
  .stat-num {
    font-size: 24px;
    font-weight: 600;
    color: #1f1f1d;
  }
  /* 期中/期末切換 */
  .exam-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .exam-tab {
    flex: 1;
    padding: 12px;
    background: #ffffff;
    border: 1px solid #e8e6df;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    color: #888;
    cursor: pointer;
    transition: all 0.15s;
  }
  .exam-tab:active { transform: scale(0.98); }
  .exam-tab.active {
    background: #185fa5;
    color: #ffffff;
    border-color: #185fa5;
  }
  .exam-tab .tab-sub {
    display: block;
    font-size: 11px;
    font-weight: 400;
    margin-top: 2px;
    opacity: 0.85;
  }
  .search-wrap {
    margin-bottom: 16px;
  }
  .search-input {
    width: 100%;
    padding: 11px 14px;
    background: #ffffff;
    border: 1px solid #e8e6df;
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    color: #1f1f1d;
    -webkit-appearance: none;
    appearance: none;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus {
    border-color: #185fa5;
  }
  #search-results {
    margin-top: 10px;
    display: none;
  }
  .search-count {
    font-size: 12px;
    color: #888;
    padding: 4px 4px 8px;
  }
  .search-empty {
    padding: 16px;
    text-align: center;
    font-size: 13px;
    color: #888;
    background: #ffffff;
    border: 1px solid #e8e6df;
    border-radius: 10px;
  }
  .search-item {
    background: #ffffff;
    border: 1px solid #e8e6df;
    border-radius: 10px;
    padding: 11px 13px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .search-item:active {
    transform: scale(0.99);
    background: #f5f5f0;
  }
  .search-item-meta {
    font-size: 11px;
    color: #888;
    margin-bottom: 3px;
  }
  .search-item-stem {
    font-size: 13px;
    line-height: 1.55;
    color: #1f1f1d;
    word-break: break-word;
  }
  mark {
    background: #faeeda;
    color: #854f0b;
    padding: 0 2px;
    border-radius: 2px;
  }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .badge-ok {
    background: #e1f5ee;
    color: #085041;
  }
  .badge-no {
    background: #fcebeb;
    color: #791f1f;
  }
  .mode-card {
    background: #ffffff;
    border: 1px solid #e8e6df;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    user-select: none;
  }
  .mode-card:active { transform: scale(0.98); background: #f5f5f0; }
  .mode-card.disabled { opacity: 0.45; pointer-events: none; }
  .mode-card-static {
    background: #ffffff;
    border: 1px solid #e8e6df;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 10px;
    user-select: none;
  }
  .count-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .count-label {
    font-size: 13px;
    color: #888;
  }
  .count-pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
  }
  .count-pill {
    padding: 6px 12px;
    background: #f5f5f0;
    border: 1px solid #e8e6df;
    border-radius: 999px;
    font-size: 13px;
    color: #555;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .count-pill:active { transform: scale(0.95); }
  .count-pill.active {
    background: #1f1f1d;
    color: #ffffff;
    border-color: #1f1f1d;
  }
  .mode-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .mode-desc {
    font-size: 13px;
    color: #888;
  }
  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 12px;
    color: #888;
  }
  .progress-bar {
    height: 4px;
    background: #e8e6df;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .progress-fill {
    height: 100%;
    background: #185fa5;
    transition: width 0.3s;
  }
  .q-card {
    background: #ffffff;
    border: 1px solid #e8e6df;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .q-stem {
    font-size: 15px;
    line-height: 1.75;
    margin-bottom: 14px;
    word-break: break-word;
  }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    padding: 12px 14px;
    margin-bottom: 8px;
    background: #ffffff;
    border: 1px solid #e8e6df;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.6;
    color: #1f1f1d;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    word-break: break-word;
  }
  .opt:active:not(:disabled) { transform: scale(0.98); }
  .opt:disabled { cursor: default; }
  .opt.correct {
    background: #e1f5ee;
    border-color: #1d9e75;
    color: #085041;
  }
  .opt.wrong {
    background: #fcebeb;
    border-color: #e24b4a;
    color: #791f1f;
  }
  .opt-key {
    display: inline-block;
    width: 22px;
    font-weight: 600;
  }
  .explain {
    margin-top: 14px;
    padding: 14px;
    background: #f5f5f0;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.75;
    color: #555;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .explain b {
    color: #1f1f1d;
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
  }
  .btn-primary {
    width: 100%;
    padding: 13px;
    background: #1f1f1d;
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    margin-top: 14px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn-primary:active { transform: scale(0.98); opacity: 0.85; }
  .btn-secondary {
    width: 100%;
    padding: 11px;
    background: transparent;
    color: #888;
    border: 1px solid #e8e6df;
    border-radius: 10px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    margin-top: 16px;
  }
  .btn-back {
    background: transparent;
    border: none;
    padding: 8px 0;
    font-size: 14px;
    color: #888;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 6px;
  }
  .complete {
    text-align: center;
    padding: 32px 0;
  }
  .complete-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a18; color: #f0efe9; }
    .stat-card, .mode-card, .q-card, .mode-card-static { background: #28272a; border-color: #3a3936; }
    .exam-tab { background: #28272a; border-color: #3a3936; color: #999; }
    .exam-tab.active { background: #378add; color: #ffffff; border-color: #378add; }
    .search-input { background: #28272a; border-color: #3a3936; color: #f0efe9; }
    .search-input:focus { border-color: #378add; }
    .search-item { background: #28272a; border-color: #3a3936; }
    .search-item:active { background: #1a1a18; }
    .search-item-stem { color: #f0efe9; }
    .search-empty { background: #28272a; border-color: #3a3936; }
    mark { background: #633806; color: #fac775; }
    .badge-ok { background: #04342c; color: #9fe1cb; }
    .badge-no { background: #501313; color: #f7c1c1; }
    .count-pill { background: #1a1a18; border-color: #3a3936; color: #b5b3ac; }
    .count-pill.active { background: #f0efe9; color: #1a1a18; border-color: #f0efe9; }
    .stat-num { color: #f0efe9; }
    .stat-label, .mode-desc, .meta-row, .btn-back, .btn-secondary { color: #999; }
    .progress-bar { background: #3a3936; }
    .opt { background: #28272a; border-color: #3a3936; color: #f0efe9; }
    .opt.correct { background: #04342c; border-color: #1d9e75; color: #9fe1cb; }
    .opt.wrong { background: #501313; border-color: #e24b4a; color: #f7c1c1; }
    .explain { background: #1a1a18; color: #b5b3ac; }
    .explain b { color: #f0efe9; }
    .btn-primary { background: #f0efe9; color: #1a1a18; }
    .mode-card:active { background: #1a1a18; }
    .btn-secondary { border-color: #3a3936; }
  }

body {max-width:680px; padding:24px 20px 36px;}
button, input, textarea {font:inherit;}
button:focus-visible, a:focus-visible, summary:focus-visible {outline:3px solid #378add;outline-offset:4px;}
.site-header {padding:12px 0 20px;}
.site-header h1 {font-size:28px;letter-spacing:-.5px;margin:8px 0;}
.site-header p {color:#73736e;font-size:13px;margin:0;line-height:1.8;}
.eyebrow {font-size:10px;letter-spacing:2px;color:#185fa5;font-weight:700;}
.stats-help {font-size:11px;color:#777;margin:-5px 0 20px;}
.full {width:100%;text-align:left;display:block;color:inherit;font:inherit;}
.mode-title,.mode-desc,.search-item-meta,.search-item-stem {display:block;}
.mode-card:disabled {opacity:.48;cursor:default;transform:none;}
.search-item {width:100%;text-align:left;font-family:inherit;}
#results {margin-top:12px;}
.badge {background:#ecebe5;color:#666;}
.resume-card {display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid #b8cee0;background:#edf4fb;padding:14px;border-radius:12px;margin:0 0 18px;font-size:12px;}
.btn-small {background:#185fa5;color:white;border:0;border-radius:8px;padding:9px 12px;cursor:pointer;white-space:nowrap;}
.q-stem {font-size:17px;line-height:1.9;}
.meta-row {gap:10px;flex-wrap:wrap;}
.tf-options {display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tf-options .opt {min-height:84px;margin:0;display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap;}
.answer-key {font-size:23px;font-weight:600;}
.source-note {border-left:3px solid #c28a26;background:#fff6e3;padding:12px 14px;margin:14px 0 0;font-size:12px;line-height:1.8;color:#75531b;border-radius:0 8px 8px 0;}
.table-figure {margin:0 0 18px;}
.table-figure img {display:block;width:100%;height:auto;border:1px solid #ddd;border-radius:5px;}
figcaption {font-size:11px;color:#777;line-height:1.7;margin-top:6px;}
.table-zoom {border:0;background:none;color:#185fa5;padding:4px 0;cursor:pointer;text-decoration:underline;}
dialog {max-width:96vw;width:1000px;border:1px solid #999;border-radius:12px;padding:16px;background:#fff;color:#222;}
dialog::backdrop {background:#0009;}
.zoom-scroll {overflow:auto;margin-top:12px;}
.zoom-scroll img {width:1000px;max-width:none;height:auto;display:block;}
a {color:#185fa5;}
textarea {width:100%;display:block;margin:8px 0;padding:12px;border:1px solid #d9d8d0;border-radius:9px;background:#fafaf7;color:inherit;resize:vertical;line-height:1.8;}
.draft-label {font-size:13px;font-weight:600;}
.muted {color:#777;font-size:13px;line-height:1.8;}
.self-help {font-size:13px;}
.self-actions {display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.self-actions button {margin-top:0;}
.formula {font-weight:600;color:#185fa5;background:#edf4fb;border-radius:8px;padding:12px;overflow-wrap:anywhere;}
.q-card h2 {margin-top:0;}
.about {font-size:12px;color:#777;line-height:1.8;margin:24px 0 12px;}
.about summary {cursor:pointer;}
footer {text-align:center;color:#92918a;font-size:11px;line-height:2;margin-top:30px;}
.sr-only {position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;}
@media(max-width:400px){body{padding:16px 14px;}.q-stem{font-size:16px;}.tf-options .opt{font-size:13px;}.resume-card{align-items:flex-start;}.meta-row{font-size:11px;}}
@media(prefers-color-scheme:dark){.site-header p,.muted,.stats-help,.about,figcaption{color:#aaa;}.eyebrow,a{color:#8ac5ff;}.source-note{background:#392b16;color:#f1d29a;}.resume-card,.formula{background:#172d40;color:#b9dcff;border-color:#315573;}.badge{background:#44423b;color:#ddd;}textarea{background:#1a1a18;border-color:#444;}.full{color:#eee;}}

const TF = [
[1,1,1,'投資名人巴菲特（Buffett）的波克夏（BRK-A），其資產配置的投資組合中，90% 是聚焦投資於股票。',false,'依原題庫更正為 25%。','此比例屬講義情境，PDF 未標示統計時點與計算分母；請勿視為目前持股比例。'],
[2,1,1,'華爾街的投資團隊觀察，可以發現世界 10 大首富中的巴菲特的波克夏（BRK-A）投資之核心操盤團隊人物約 100 名，團隊超級龐大。',false,'依原題庫更正：核心操盤團隊人物約 3 名。','人物數量與排名屬講義情境，可能隨時間變動。'],
[3,1,1,'投資人只要公司有提供資產負債表、損益表與現金流量表，就可以投資該公司。',false,'不能只看是否提供報表，還要仔細分析三大報表數據背後的意義。'],
[4,1,1,'投資人只要公司有提供股價日線、週線、月線走勢圖，就可以投資該公司。',false,'還要分析走勢圖背後的多空意義，不能僅憑有提供圖表就決定投資。'],
[5,1,1,'凱因斯（Keynes）的貨幣需求三項動機為交易動機、預防動機與投機動機；可以用於投資的錢是「交易動機的活動性餘額」。',false,'依題庫：可用於投資的是「投機動機的閒置性餘額」。交易與預防用途的資金應先保留。'],
[6,1,1,'投資須有彈性，影響投資收益的三大因素是時間、報酬與風險。',true,'題庫答案為 O。評估投資時，應一併考慮時間、報酬與風險。'],
[7,2,1,'老王以每股 20 元買進 1 張（1,000 股）A 股票，一年後以每股 24 元賣出，期間收到每股現金股利 0.5 元。不考慮交易成本，其持有一年的報酬率為 22.5%。',true,'持有期間報酬率 =（賣價 − 買價 + 股利）÷ 買價\n=（24 − 20 + 0.5）÷ 20 = 0.225 = 22.5%。張數不影響報酬率。'],
[8,2,2,'某投資案繁榮期報酬率 20%、正常期 12%、蕭條期 −10%；三種時期機率相同，其期望報酬率為 22%。',false,'E(R) = 20% × 1/3 + 12% × 1/3 − 10% × 1/3\n= 7.333…%，不是 22%。'],
[9,2,2,'華新電纜與燁輝鋼鐵於 111 年 4 月報酬率期望值分別為 0.10 與 0.06，變異數為 0.10 與 0.12。以變異係數比較相對風險，燁輝高於華新，選擇上華新較理想。',true,'CV = 標準差 ÷ 期望報酬率。依題目變異數數值：\n華新 CV = √0.10 ÷ 0.10 ≈ 3.162\n燁輝 CV = √0.12 ÷ 0.06 ≈ 5.774。\n因此燁輝相對風險較高。'],
[10,2,2,'國巨與華新科於 109 年 12 月報酬期望值分別為 12% 與 6%，變異數分別為 36% 與 9%。以變異係數比較，國巨的相對風險較大。',false,'依原題庫解法：國巨 CV = 6% ÷ 12% = 1/2；華新科 CV = 3% ÷ 6% = 1/2，兩者相同。','原題庫「變異數 36%、9%」與其開根號所得「標準差 6%、3%」的百分比單位不一致。複習時保留原題判定；正式計算需先統一變異數與報酬率的單位。'],
[11,2,2,'投資組合多角化（portfolio diversification）的核心目的是「在不降低預期報酬率的前提下，降低投資組合的風險」。',true,'題庫答案為 O。透過不同資產報酬的相關性，分散投資可降低組合風險；並不表示能消除所有風險。'],

const QUESTIONS = [...TF,...WRITTEN];

const KEY = 'investment_quiz_v1';
const SESSION_KEY = KEY + '_session';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lines = s => esc(s).replace(/\n/g,'<br>');
const read = (key,fallback) => {try{return JSON.parse(localStorage.getItem(key)) ?? fallback;}catch{return fallback;}};
let storageOK = true;
function write(key,value){try{localStorage.setItem(key,JSON.stringify(value));}catch{storageOK=false;}}
let saved = read(KEY,{});
let history = saved && typeof saved.history==='object' && !Array.isArray(saved.history) && saved.history ? saved.history : {};
let drafts = saved && typeof saved.drafts==='object' && !Array.isArray(saved.drafts) && saved.drafts ? saved.drafts : {};
let tab = 'tf';
let session = null;
let count = 10;
const valid = new Set(QUESTIONS.map(q=>q.id));
history = Object.fromEntries(Object.entries(history).filter(([id,v])=>valid.has(id)&&['correct','wrong'].includes(v)));
function save(){write(KEY,{history,drafts});}
function saveSession(){write(SESSION_KEY,session);}
function pool(){return QUESTIONS.filter(q=>q.type===tab);}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function btn(text,action,cls='btn-primary',extra=''){return `<button class="${cls}" data-action="${action}" ${extra}>${text}</button>`;}
function mount(html){$('#app').innerHTML=html;window.scrollTo(0,0);}
function status(q){return history[q.id]==='correct'?'已掌握':history[q.id]==='wrong'?'待複習':'尚未練習';}
function metadata(q){return `${q.type==='tf'?'是非':'計算／申論'}第 ${q.n} 題 · PDF 第 ${q.page} 頁${q.id==='tf-7'?'起':''}`;}
function stats(qs){const done=qs.filter(q=>history[q.id]);const ok=done.filter(q=>history[q.id]==='correct').length;const wrong=done.length-ok;return {done:done.length,ok,wrong,rate:done.length?Math.round(ok/done.length*100):0};}
function note(q){return q.note?`<aside class="source-note"><strong>講義補充與疑義</strong><br>${lines(q.note)}</aside>`:'';}
function questionBody(q){return `<div class="q-stem">${lines(q.stem)}</div>${q.id==='tf-38'?`<figure class="table-figure"><img src="${FUND_TABLE}" alt="原題庫基金比較表，駿利亨德森環球生命科技基金 B2 美元的 Beta 為 1.18"><figcaption>原題庫表格，可點開放大檢視。<br><button class="table-zoom" data-action="zoom">放大原表 ↗</button></figcaption></figure><dialog aria-label="原題庫基金比較表放大檢視" id="zoom-dialog"><button class="btn-small" data-action="close-zoom">關閉放大表格</button><div class="zoom-scroll"><img src="${FUND_TABLE}" alt="基金比較表放大圖，Beta 欄第二列為 1.18"></div></dialog>`:''}`;}
function header(){return '<header class="site-header"><span class="eyebrow">INVESTMENT · MIDTERM</span><h1>📚 投資學刷題</h1><p>夜四技期中考 · 第 1–8 週<br>SML、CAPM、投資組合與估值</p></header>';}

  const qs=pool(), s=stats(qs);
  const pending=read(SESSION_KEY,null);
  const resume=pending&&Array.isArray(pending.ids)&&pending.ids.length&&Number.isInteger(pending.idx)&&pending.idx>=0&&pending.idx<pending.ids.length&&pending.ids.every(id=>valid.has(id))&&pending.answers&&typeof pending.answers==='object';
  mount(`${header()}<nav class="exam-tabs" aria-label="題型"><button class="exam-tab ${tab==='tf'?'active':''}" data-tab="tf">是非題<span class="tab-sub">41 題 · 即時判分</span></button><button class="exam-tab ${tab==='written'?'active':''}" data-tab="written">計算與申論<span class="tab-sub">7 題 · 對照自評</span></button></nav>
  <div class="stat-grid">${[['題庫總數',qs.length],['已練習',s.done],['待複習',s.wrong],[tab==='tf'?'最新作答正確率':'自評掌握率',s.rate+'%']].map(([label,num])=>`<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-num">${num}</div></div>`).join('')}</div>
  <p class="stats-help">統計以每題最近一次作答${tab==='written'?'自評':''}為準。答對後會移出錯題本。</p>
  ${!storageOK?'<p class="source-note" role="status">瀏覽器無法儲存紀錄，本次仍可練習；關閉後可能遺失。</p>':''}
  ${resume?`<div class="resume-card"><span>上次練習停在第 ${pending.idx+1}／${pending.ids.length} 題</span>${btn('繼續練習','resume','btn-small')}</div>`:''}
  <label class="sr-only" for="search">搜尋題目與解析</label><input id="search" type="search" class="search-input" placeholder="搜尋題目、關鍵字或公式…" autocomplete="off"><div id="results" aria-live="polite"></div>
  <h2>選擇練習方式</h2>
  ${btn('<span class="mode-title">📖 依主題練習</span><span class="mode-desc">按觀念分組，保留 PDF 原題號</span>','topics','mode-card full')}
  <div class="mode-card-static"><div class="mode-title">🎲 隨機抽題</div><div class="mode-desc">從目前題型隨機抽題、不重複出題</div><div class="count-row">${[...new Set([5,10,20,qs.length].filter(n=>n<=qs.length))].map(n=>`<button class="count-pill ${n===Math.min(count,qs.length)?'active':''}" data-count="${n}">${n===qs.length?'全部 '+n+' 題':n+' 題'}</button>`).join('')}</div>${btn('開始練習 →','random')}</div>
  ${btn(`<span class="mode-title">✎ ${tab==='tf'?'錯題複習':'待加強複習'} <span class="badge">${s.wrong}</span></span><span class="mode-desc">${s.wrong?'集中練習尚未掌握的題目':'目前沒有待複習題目'}</span>`,'wrong','mode-card full',s.wrong?'':'disabled')}
  ${btn('<span class="mode-title">∑ 公式與觀念速查</span><span class="mode-desc">報酬率、CV、CAPM、CML 與高登模型</span>','formulas','mode-card full')}
  <details class="about"><summary>題庫來源與使用說明</summary><p>依使用者提供的「夜四技 習作複習 題庫1.pdf」整理，含 41 題是非與 7 題計算、申論。已修正常見文字擷取錯字並將圖片公式轉為可讀文字；分組為複習用主題，並非原書章節。</p><p>是非題按原題庫 O／X 計分。部分講義說法有簡化或疑義，解析另列補充。計算與申論以參考答案自行評估。題庫用於課程複習。</p><p>紀錄與申論草稿保存在本機瀏覽器，不會上傳；更換裝置、清除網站資料或使用無痕模式，紀錄可能不保留。</p><p>制度補充來源：<a href="https://www.twse.com.tw/zh/products/system/trading.html" target="_blank" rel="noopener">證交所交易制度</a>、<a href="https://www.twse.com.tw/zh/clearing/clearing/features.html" target="_blank" rel="noopener">交割週期</a>、<a href="https://www.nseindia.com/static/products-services/indices-beta" target="_blank" rel="noopener">Beta 定義</a>。</p></details>
  ${s.done?btn('清除目前題型的作答紀錄','reset','btn-secondary'):''}<footer>投資學期中考複習 · 48 題<br><a href="https://github.com/Breitiling0830/investment-quiz" target="_blank" rel="noopener">GitHub 原始碼 ↗</a></footer>`);
  $('#search').addEventListener('input',search);
}
function search(){const kw=$('#search').value.trim().toLowerCase();$('#results').style.display=kw?'block':'none';if(!kw)return;const found=pool().filter(q=>(q.stem+' '+q.exp+' '+q.note).toLowerCase().includes(kw));$('#results').innerHTML=`<p class="search-count">找到 ${found.length} 題 · 點選查看答案</p>`+found.map(q=>`<button class="search-item full" data-preview="${q.id}"><span class="search-item-meta">${metadata(q)} · ${status(q)}</span><span class="search-item-stem">${esc(q.stem.slice(0,90))}${q.stem.length>90?'…':''}</span></button>`).join('')+(found.length?'':'<p class="search-empty">找不到符合的題目，試試「風險」或「CAPM」。</p>');}
function topics(){mount(`${btn('← 返回首頁','home','btn-back')}<h1>依主題練習</h1><p class="muted">${tab==='tf'?'是非題':'計算與申論'} · 保留 PDF 原題號</p>${Object.entries(TOPICS).map(([id,name])=>{const qs=pool().filter(q=>q.ch===+id);if(!qs.length)return '';const s=stats(qs);return btn(`<span class="mode-title">${name}</span><span class="mode-desc">${qs.length} 題 · 已練習 ${s.done} · ${tab==='tf'?'答對':'已掌握'} ${s.ok}</span>`,'topic-'+id,'mode-card full');}).join('')}`);}
function preview(id){const q=QUESTIONS.find(q=>q.id===id);if(!q)return;mount(`${btn('← 返回首頁','home','btn-back')}<p class="meta-row">${metadata(q)}</p><article class="q-card">${questionBody(q)}<div class="explain"><b>${q.type==='tf'?'講義答案：'+(q.answer?'O（正確）':'X（錯誤）'):'參考答案'}</b>${lines(q.exp)}</div>${note(q)}</article>${btn('練習這一題','single-'+q.id)}`);}
function start(mode,qs){if(!qs.length)return;session={mode,ids:qs.map(q=>q.id),idx:0,answers:{},revealed:false};saveSession();question();}
function question(){
  const q=QUESTIONS.find(q=>q.id===session.ids[session.idx]);
  const record=session.answers[q.id];
  const done=!!record;
  const revealed=done||session.revealed;
  mount(`${btn('← 返回首頁（自動保留進度）','home','btn-back')}<div class="meta-row"><span>${esc(session.mode)}</span><span>${session.idx+1}／${session.ids.length}</span></div><div class="progress-bar" role="progressbar" aria-label="練習進度" aria-valuemin="0" aria-valuemax="${session.ids.length}" aria-valuenow="${session.idx+(done?1:0)}"><div class="progress-fill" style="width:${(session.idx+(done?1:0))/session.ids.length*100}%"></div></div>
  <p class="meta-row">${metadata(q)} · ${TOPICS[q.ch]}</p>
  <article class="q-card">${questionBody(q)}
  ${q.type==='tf'?`<div class="tf-options">${[true,false].map(value=>`<button class="opt ${done?(value===q.answer?'correct':value===record.chosen?'wrong':''):''}" data-answer="${value}" ${done?'disabled':''}><span class="answer-key">${value?'O':'X'}</span>${value?'正確':'錯誤'}${done&&value===q.answer?' · 講義答案':''}</button>`).join('')}</div>`:`<label for="draft" class="draft-label">先寫下解題步驟或想法</label><textarea id="draft" placeholder="在這裡計算、列重點，或先在紙上作答…" rows="5">${esc(typeof drafts[q.id]==='string'?drafts[q.id]:'')}</textarea><small class="muted">草稿自動儲存在此瀏覽器，不影響自評結果。</small>${!revealed?btn('查看參考答案','reveal'):''}`}
  <div id="feedback" aria-live="polite">${revealed?`<div class="explain"><b>${q.type==='tf'?(record.correct?'✓ 答對了':'✗ 答錯了')+' · 講義答案：'+(q.answer?'O':'X'):'參考答案與解題重點'}</b>${lines(q.exp)}</div>${note(q)}`:''}</div>
  ${q.type==='written'&&revealed&&!done?`<p class="self-help">對照上方參考答案，選擇這題的掌握程度：</p><div class="self-actions">${btn('還需加強','assess-wrong','btn-secondary')}${btn('已掌握 ✓','assess-correct')}</div>`:''}
  ${done?`${q.type==='written'?`<p class="muted">本題自評：${record.correct?'已掌握':'還需加強'}</p>`:''}${btn(session.idx===session.ids.length-1?'完成這輪練習':'下一題 →','next')}`:''}
  </article>`);
  const draft=$('#draft');if(draft)draft.addEventListener('input',()=>{drafts[q.id]=draft.value;save();});
}
function answer(chosen){const q=QUESTIONS.find(q=>q.id===session.ids[session.idx]);if(session.answers[q.id])return;const correct=q.type==='tf'?chosen===q.answer:chosen;session.answers[q.id]={chosen,correct};history[q.id]=correct?'correct':'wrong';save();saveSession();question();}
function complete(){const answers=Object.values(session.answers),correct=answers.filter(a=>a.correct).length,total=session.ids.length;const wrong=session.ids.filter(id=>session.answers[id]&&!session.answers[id].correct).map(id=>QUESTIONS.find(q=>q.id===id));mount(`<div class="complete"><span class="eyebrow">SESSION COMPLETE</span><h1>完成這輪練習！</h1><p class="muted">${esc(session.mode)} · ${total} 題</p><div class="stat-grid">${[['本輪題數',total],[tab==='tf'?'本輪答對':'自評掌握',correct],[tab==='tf'?'正確率':'掌握率',Math.round(correct/total*100)+'%'],['待複習',total-correct]].map(([l,n])=>`<div class="stat-card"><div class="stat-label">${l}</div><div class="stat-num">${n}</div></div>`).join('')}</div>${wrong.length?btn('再練這輪未掌握的題目','retry'):''}${btn('回到首頁','home','btn-secondary')}</div>`);session.finished=true;session.retry=wrong.map(q=>q.id);write(SESSION_KEY,null);}
function formulas(){mount(`${btn('← 返回首頁','home','btn-back')}<h1>公式與觀念速查</h1>${[
  ['持有期間報酬率','（賣價 − 買價 + 現金股利）÷ 買價','計算時各金額使用同一單位；多期報酬不能直接把百分比相加。'],
  ['期望報酬率','E(R) = Σ pᵢ × Rᵢ','用各情境機率加權；所有情境機率合計為 1。'],
  ['變異係數','CV = σ ÷ E(R)','衡量每單位期望報酬的相對風險。變異數須先開根號得到標準差，並統一單位。'],
  ['CAPM 與風險溢酬','E(Rᵢ) = Rf + βᵢ × [E(Rm) − Rf]','市場風險溢酬 = E(Rm) − Rf；個股風險溢酬 = βᵢ × [E(Rm) − Rf]。'],
  ['SML 與 CML','SML：橫軸 β；CML：橫軸 σ','SML 斜率為市場風險溢酬；CML 斜率為 [E(Rm) − Rf] ÷ σm。CML 針對效率投資組合。β > 1 不等於必然值得投資。'],
  ['高登成長模型','P₀ = D₁ ÷ (r − g)；D₁ = D₀ × (1 + g)','r > g；今年「已發放」是 D₀，下期預期股利才是 D₁。股利須符合固定成長等模型假設。'],
  ['本益比與殖利率','P/E = 股價 ÷ EPS；殖利率 = 年股息 ÷ 股價','兩者需搭配成長、產業及股利持續性判斷。'],
  ['風險與選擇權','系統性：市場因素；非系統性：個別公司','分散投資可降低非系統性風險。買權 = Call；賣權 = Put。']
].map(([title,formula,desc])=>`<section class="q-card"><h2>${title}</h2><p class="formula">${esc(formula)}</p><p class="muted">${desc}</p></section>`).join('')}`);}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||t.disabled)return;
  if(t.dataset.tab){tab=t.dataset.tab;home();return;}
  if(t.dataset.count){count=+t.dataset.count;document.querySelectorAll('[data-count]').forEach(b=>b.classList.toggle('active',b===t));return;}
  if(t.dataset.preview){preview(t.dataset.preview);return;}
  if(t.dataset.answer!==undefined){answer(t.dataset.answer==='true');return;}
  const a=t.dataset.action;if(!a)return;
  if(a==='zoom')$('#zoom-dialog').showModal();else if(a==='close-zoom')$('#zoom-dialog').close();
  else if(a==='home')home();else if(a==='topics')topics();else if(a==='formulas')formulas();
  else if(a==='random')start('隨機抽題',shuffle(pool()).slice(0,Math.min(count,pool().length)));
  else if(a==='wrong')start('待複習題目',shuffle(pool().filter(q=>history[q.id]==='wrong')));
  else if(a.startsWith('topic-')){const ch=+a.slice(6);start(TOPICS[ch],pool().filter(q=>q.ch===ch));}
  else if(a.startsWith('single-'))start('單題練習',[QUESTIONS.find(q=>q.id===a.slice(7))]);
  else if(a==='resume'){session=read(SESSION_KEY,null);tab=QUESTIONS.find(q=>q.id===session.ids[0]).type;question();}
  else if(a==='reveal'){session.revealed=true;saveSession();question();}
  else if(a==='assess-correct')answer(true);else if(a==='assess-wrong')answer(false);
  else if(a==='next'){if(session.idx===session.ids.length-1)complete();else{session.idx++;session.revealed=false;saveSession();question();}}
  else if(a==='retry')start('本輪待加強',session.retry.map(id=>QUESTIONS.find(q=>q.id===id)));
  else if(a==='reset'&&confirm('確定清除目前題型的作答紀錄？另一題型與申論草稿會保留。')){pool().forEach(q=>delete history[q.id]);save();const pending=read(SESSION_KEY,null);if(pending&&pending.ids&&pending.ids.some(id=>pool().some(q=>q.id===id)))write(SESSION_KEY,null);home();}
});
home();

</script></body></html>
